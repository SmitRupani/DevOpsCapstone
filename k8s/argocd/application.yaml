apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logitrack
  namespace: argocd
  labels:
    app: logitrack
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SmitRupani/DevOpsCapstone.git
    targetRevision: main
    path: helm/logitrack
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: logitrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
